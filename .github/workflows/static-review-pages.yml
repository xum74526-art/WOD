name: Deploy static review page

on:
  push:
    branches: [main]
    paths:
      - "static-review/**"
      - ".github/workflows/static-review-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify static review package
        run: node --test static-review/site.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static review artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-review

      - name: Deploy static review page
        id: deployment
        uses: actions/deploy-pages@v4

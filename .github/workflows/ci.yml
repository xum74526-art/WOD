name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m pip_audit -r services/api/requirements.txt
      - run: python -m compileall -q services/api/app services/api/init_db.py
      - run: cd services/api && python -m unittest discover -s tests -p 'test_*.py'
      - run: python packages/api-contracts/export_openapi.py
      - run: git diff --exit-code -- packages/api-contracts/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm 11 uses the supported bulk advisory endpoint, without retired quick fallback.
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --prefix apps/web --no-audit
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm run check:web
      - run: npm --prefix apps/web test
      - run: npm run build:web
        env:
          API_ORIGIN: https://wod.kai.com

  ios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ios/package-lock.json
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --prefix apps/ios --no-audit
      - run: npm --prefix apps/ios audit --audit-level=high
      - run: npm run check:ios
      - run: npm run test:ios
      - run: npm --prefix apps/ios run test:i18n
      - run: npm run build:ios:app

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --prefix apps/android --no-audit
      - run: npm --prefix apps/android audit --audit-level=high
      - run: npm run check:android
      - run: npm run test:android
      - run: npm --prefix apps/android run test:i18n
      - run: npm run build:android:app
      - run: node packages/api-contracts/check-mobile-api.mjs
      - run: node packages/api-contracts/check-client-boundaries.mjs

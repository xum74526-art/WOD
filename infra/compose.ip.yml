name: kai-ip-deployment

x-backend-environment: &backend-environment
  APP_ENV: development
  POSTGRES_USER: ${POSTGRES_USER:-kai}
  POSTGRES_DB: ${POSTGRES_DB:-kai}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  SECRET_KEY_FILE: /run/secrets/app_secret_key
  PAYOUT_ENCRYPTION_KEY_FILE: /run/secrets/payout_encryption_key
  KYC_ENCRYPTION_KEY_FILE: /run/secrets/kyc_encryption_key
  PINGXX_API_KEY_FILE: /run/secrets/pingxx_api_key
  PINGXX_MERCHANT_PRIVATE_KEY_FILE: /run/secrets/pingxx_merchant_private_key
  PINGXX_PUBLIC_KEY_FILE: /run/secrets/pingxx_public_key
  SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  CORS_ORIGINS: http://${KAI_DOMAIN:?KAI_DOMAIN is required}
  FRONTEND_BASE_URL: http://${KAI_DOMAIN}
  PUBLIC_API_BASE_URL: http://${KAI_DOMAIN}
  AGENT_PUBLIC_API_BASE_URL: http://${KAI_DOMAIN}
  COOKIE_SECURE: "false"
  AGENT_LOCAL_SIMULATOR_ENABLED: "true"
  PAYMENT_PROVIDER_ENABLED: "false"
  PAYMENT_PROVIDER: disabled
  PINGXX_LIVE_MODE: "false"
  PINGXX_REQUEST_SIGNING_ENABLED: "false"
  EMAIL_VERIFICATION_ENABLED: "false"
  EMAIL_NOTIFICATION_ENABLED: "false"
  NEWS_SYNC_ENABLED: "false"
  MARKET_SNAPSHOT_ENABLED: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json

x-backend-secrets: &backend-secrets
  - postgres_password
  - redis_password
  - app_secret_key
  - payout_encryption_key
  - kyc_encryption_key
  - pingxx_api_key
  - pingxx_merchant_private_key
  - pingxx_public_key
  - smtp_password

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kai}
      POSTGRES_USER: ${POSTGRES_USER:-kai}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  migrate:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: kai-backend:${KAI_IMAGE_TAG:-latest}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [private]

  backend:
    image: kai-backend:${KAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - market_cache:/app/data
    ports:
      - "127.0.0.1:8100:8100"
    networks: [private]

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_PATH:?POSTGRES_PASSWORD_FILE_PATH is required}
  redis_password:
    file: ${REDIS_PASSWORD_FILE_PATH:?REDIS_PASSWORD_FILE_PATH is required}
  app_secret_key:
    file: ${APP_SECRET_KEY_FILE_PATH:?APP_SECRET_KEY_FILE_PATH is required}
  payout_encryption_key:
    file: ${PAYOUT_ENCRYPTION_KEY_FILE_PATH:?PAYOUT_ENCRYPTION_KEY_FILE_PATH is required}
  kyc_encryption_key:
    file: ${KYC_ENCRYPTION_KEY_FILE_PATH:?KYC_ENCRYPTION_KEY_FILE_PATH is required}
  pingxx_api_key:
    file: ${PINGXX_API_KEY_FILE_PATH:?PINGXX_API_KEY_FILE_PATH is required}
  pingxx_merchant_private_key:
    file: ${PINGXX_MERCHANT_PRIVATE_KEY_FILE_PATH:?PINGXX_MERCHANT_PRIVATE_KEY_FILE_PATH is required}
  pingxx_public_key:
    file: ${PINGXX_PUBLIC_KEY_FILE_PATH:?PINGXX_PUBLIC_KEY_FILE_PATH is required}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE_PATH:?SMTP_PASSWORD_FILE_PATH is required}

volumes:
  postgres_data:
    name: kai-ip_postgres_data
  redis_data:
    name: kai-ip_redis_data
  market_cache:
    name: kai-ip_market_cache

networks:
  private:

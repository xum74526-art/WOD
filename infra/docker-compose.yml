services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kai
      POSTGRES_USER: kai
      POSTGRES_PASSWORD: change-before-use
    ports:
      - "55432:5432"
    volumes:
      - kai_postgres:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
    depends_on:
      - redis

volumes:
  kai_postgres:

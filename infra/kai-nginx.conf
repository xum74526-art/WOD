server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The API accepts a 20 MiB community video. Keep one extra MiB for the
    # multipart envelope while retaining a hard request-size ceiling.
    client_max_body_size 21m;

    # Market ranking, model and candle responses are JSON-heavy. Compress them
    # at the public edge so all three clients transfer the same payload with
    # substantially fewer bytes; already-compressed media is excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Registration JSON is normally below 1 KiB. Limit only its two public
    # entry points so oversized bodies never reach Node/FastAPI buffering.
    # The 32 KiB edge ceiling leaves room for the applications' localized
    # 16 KiB rejection; media uploads keep the separate 21 MiB allowance.
    location = /api/v1/auth/password/register {
        client_max_body_size 32k;
        error_page 413 = @registration_payload_too_large;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/password/register/ {
        client_max_body_size 32k;
        error_page 413 = @registration_payload_too_large;
        return 308 /api/v1/auth/password/register;
    }

    location = /api/auth/register {
        client_max_body_size 32k;
        error_page 413 = @registration_payload_too_large;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register/ {
        client_max_body_size 32k;
        error_page 413 = @registration_payload_too_large;
        return 308 /api/auth/register;
    }

    location @registration_payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"code":1,"msg":"注册信息过长，请缩短后重试","data":null,"error":{"code":"payload_too_large","message":"注册信息过长，请缩短后重试"}}';
    }

    # Video normalization may take longer than Nginx's 60-second default.
    # Keep the browser BFF and native API routes above the API's 180-second
    # transcode ceiling without relaxing unrelated requests.
    location = /api/v1/canonical/community/media/upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/community/media/upload {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The browser-facing BFF owns /api/v1. It stores the API token
    # in an HttpOnly cookie and must not be bypassed by the generic API proxy.
    location = /api/v1 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Native iOS/Android clients and public backend documentation use the
    # canonical /api contract.
    location ~ ^/(api/|health$|openapi\.json$|docs|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
